name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sync:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Copy main into akashic-history
        env:
          HISTORY_TOKEN: ${{ secrets.HISTORY_TOKEN }}
        run: |
          if [ -z "$HISTORY_TOKEN" ]; then
            echo "::notice::HISTORY_TOKEN is not set: akashic-history is not updated."
            exit 0
          fi
          git config user.name Nova686
          git config user.email 58865656+Nova686@users.noreply.github.com
          AKASHIC_HISTORY_URL="https://x-access-token:${HISTORY_TOKEN}@github.com/Nova686/akashic-history.git" tool/sync_history.sh

  build:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the version is new and the release secrets are set
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HISTORY_TOKEN: ${{ secrets.HISTORY_TOKEN }}
        run: |
          version_name=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          if git ls-remote --exit-code --tags origin "refs/tags/v${version_name}" > /dev/null; then
            echo "::notice::Version ${version_name} is already released: no new release is published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE_BASE64" ] || [ -z "$HISTORY_TOKEN" ]; then
            echo "::notice::KEYSTORE_BASE64, KEYSTORE_PASSWORD, DART_DEFINES_JSON and HISTORY_TOKEN are not all set: no release is published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare signing key and API keys
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DART_DEFINES_JSON: ${{ secrets.DART_DEFINES_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/akashic-release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=akashic\nstoreFile=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$RUNNER_TEMP/akashic-release.jks" > android/key.properties
          printf '%s' "$DART_DEFINES_JSON" > "$RUNNER_TEMP/dart_defines.json"
      - name: Build the signed APKs
        if: steps.secrets.outputs.ready == 'true'
        env:
          AKASHIC_DEFINES_FILE: ${{ runner.temp }}/dart_defines.json
        run: |
          tool/build_release.sh
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/akashic.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/akashic-armeabi-v7a.apk
      - name: Keep the APKs for the release
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: release/
          retention-days: 1

  publish:
    if: github.event_name == 'push' && needs.build.outputs.ready == 'true'
    needs: [build, sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks
          path: release
      - name: Tag the version and write its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/v${version_name}" -f sha="$GITHUB_SHA" > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="v${version_name}" --jq .body > "$RUNNER_TEMP/notes.md"
      - name: Publish the release in akashic-history
        env:
          GH_TOKEN: ${{ secrets.HISTORY_TOKEN }}
        run: |
          version_name=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          gh release create "v${version_name}" release/akashic.apk release/akashic-armeabi-v7a.apk \
            --repo Nova686/akashic-history \
            --target main \
            --title "Akashic ${version_name}" \
            --notes-file "$RUNNER_TEMP/notes.md"
